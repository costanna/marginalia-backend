name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marginalia
          POSTGRES_PASSWORD: marginalia
          POSTGRES_DB: marginalia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marginalia -d marginalia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Tests create and use a separate "marginalia_test" database on this server.
      DATABASE_URL: postgresql+psycopg://marginalia:marginalia@localhost:5432/marginalia

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t marginalia-api .
