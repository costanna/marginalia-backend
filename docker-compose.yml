# Local development services. Phase 0: PostgreSQL only.
# The API service is added in Phase 1, once the app and its Dockerfile exist.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marginalia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marginalia}
      POSTGRES_DB: ${POSTGRES_DB:-marginalia}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
